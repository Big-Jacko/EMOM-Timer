<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0b0c">
<title>EMOM</title>
<style>
  :root{
    --bg:#0b0b0c; --fg:#f2f0eb; --dim:#7d7b76; --line:#232325; --card:#141416;
    --accent:#f2f0eb; --go:#9fd8a6; --warn:#f0b36b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--fg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
    padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 20px);
    -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  }
  .view{display:none;max-width:520px;margin:0 auto;min-height:100%;flex-direction:column}
  .view.on{display:flex}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 28px}
  h1{font-size:15px;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
  .label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .txtbtn{font-size:14px;color:var(--dim);padding:6px 2px}
  .txtbtn:active{color:var(--fg)}

  /* list */
  .list{display:flex;flex-direction:column;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .item{background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:20px 2px;gap:12px}
  .item .t{font-size:19px;font-weight:500}
  .item .s{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.4}
  .item .acts{display:flex;gap:16px;align-items:center;flex-shrink:0}
  .play{width:44px;height:44px;border-radius:50%;border:1px solid var(--fg);display:grid;place-items:center}
  .play svg{width:14px;height:14px;margin-left:2px}
  .empty{color:var(--dim);font-size:14px;line-height:1.6;padding:28px 0;text-align:center}
  .new{margin-top:24px;border:1px solid var(--line);border-radius:14px;padding:16px;font-size:15px;text-align:center;width:100%}
  .new:active{background:var(--card)}

  /* editor */
  .field{margin-bottom:22px}
  .field .label{display:block;margin-bottom:8px}
  input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 14px;width:100%;font-size:16px;outline:none;user-select:text;-webkit-user-select:text}
  input:focus{border-color:#45454a}
  .row{display:flex;gap:12px}
  .row .field{flex:1}
  .stepper{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px}
  .stepper button{width:44px;height:46px;font-size:20px;color:var(--dim)}
  .stepper button:active{color:var(--fg)}
  .stepper span{flex:1;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}
  .mv{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .mv .n{width:22px;font-size:12px;color:var(--dim);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
  .mv input.rp{width:96px;flex-shrink:0}
  .mv .x{width:32px;color:var(--dim);font-size:20px;flex-shrink:0}
  .addmv{font-size:14px;color:var(--dim);padding:10px 0 0 30px}
  .hint{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
  .bar{margin-top:auto;padding-top:28px;display:flex;gap:12px}
  .primary{flex:1;background:var(--fg);color:var(--bg);border-radius:14px;padding:16px;font-size:16px;font-weight:600}
  .secondary{border:1px solid var(--line);border-radius:14px;padding:16px 20px;font-size:15px;color:var(--dim)}
  .danger{color:#d77a6f}

  /* timer */
  #timer{justify-content:space-between}
  .tophead{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
  .tophead .wname{font-size:13px;color:var(--dim);letter-spacing:.06em;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
  .round{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;font-variant-numeric:tabular-nums}
  .clock{font-size:min(44vw,240px);font-weight:200;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;transition:color .2s}
  .clock.prep{color:var(--warn)}
  .clock.low{color:var(--warn)}
  .prog{width:100%;height:2px;background:var(--line);margin:26px 0 30px;overflow:hidden;border-radius:2px}
  .prog i{display:block;height:100%;width:0;background:var(--fg)}
  .move{font-size:30px;font-weight:500;line-height:1.2;min-height:36px}
  .reps{font-size:17px;color:var(--dim);margin-top:8px;min-height:22px}
  .next{margin-top:34px;font-size:14px;color:var(--dim);min-height:20px}
  .next b{color:var(--fg);font-weight:500}
  .controls{display:flex;justify-content:center;align-items:center;gap:36px;padding:20px 0 8px}
  .ctl{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
  .ctl svg{width:20px;height:20px}
  .big{width:84px;height:84px;border-color:var(--fg);color:var(--fg)}
  .big svg{width:26px;height:26px}
  .done .clock{font-size:min(20vw,110px);font-weight:300;letter-spacing:0}

  /* dialog */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;padding:20px;padding-bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:9}
  .modal.on{display:flex}
  .sheet{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:480px}
  .sheet p{font-size:16px;margin-bottom:18px;line-height:1.4}
  .sheet .bar{padding-top:0}
</style>
</head>
<body>

<!-- LIBRARY -->
<section class="view on" id="library">
  <header>
    <h1>EMOM</h1>
    <button class="txtbtn" id="quickBtn">Quick start</button>
  </header>
  <div class="list" id="list"></div>
  <button class="new" id="newBtn">+ New workout</button>
</section>

<!-- EDITOR -->
<section class="view" id="editor">
  <header>
    <button class="txtbtn" id="cancelEdit">Cancel</button>
    <span class="label" id="editTitle">New workout</span>
    <button class="txtbtn danger" id="deleteBtn" style="visibility:hidden">Delete</button>
  </header>

  <div class="field">
    <label class="label" for="wName">Name</label>
    <input id="wName" placeholder="e.g. Leg day finisher" maxlength="40">
  </div>

  <div class="row">
    <div class="field">
      <span class="label">Rounds</span>
      <div class="stepper" data-k="rounds"><button data-d="-1">−</button><span></span><button data-d="1">+</button></div>
    </div>
    <div class="field">
      <span class="label">Every</span>
      <div class="stepper" data-k="interval"><button data-d="-1">−</button><span></span><button data-d="1">+</button></div>
    </div>
  </div>

  <div class="field">
    <span class="label">Movements</span>
    <div id="mvList" style="margin-top:8px"></div>
    <button class="addmv" id="addMv">+ Add movement</button>
    <p class="hint">Movements rotate each interval: minute 1 is the first, minute 2 the second, and so on, then they repeat.</p>
  </div>

  <div class="bar">
    <button class="primary" id="saveBtn">Save</button>
  </div>
</section>

<!-- TIMER -->
<section class="view" id="timer">
  <div class="tophead">
    <button class="txtbtn" id="exitBtn">Close</button>
    <span class="wname" id="tName"></span>
    <button class="txtbtn" id="soundBtn">Sound on</button>
  </div>
  <div class="center" id="center">
    <div class="round" id="tRound"></div>
    <div class="clock" id="tClock">0</div>
    <div class="prog"><i id="tProg"></i></div>
    <div class="move" id="tMove"></div>
    <div class="reps" id="tReps"></div>
    <div class="next" id="tNext"></div>
  </div>
  <div class="controls">
    <button class="ctl" id="resetBtn" aria-label="Restart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>
    </button>
    <button class="ctl big" id="ppBtn" aria-label="Play or pause"></button>
    <button class="ctl" id="skipBtn" aria-label="Skip interval">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>
    </button>
  </div>
</section>

<!-- CONFIRM -->
<div class="modal" id="modal">
  <div class="sheet">
    <p id="modalText"></p>
    <div class="bar">
      <button class="secondary" id="modalNo">Cancel</button>
      <button class="primary" id="modalYes">OK</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
  const PREP = 10; // seconds of get-ready

  // ---------- storage ----------
  const KEY = 'emom.workouts.v1';
  let mem = null;
  const load = () => {
    try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch(e) {}
    return mem || [
      { id: uid(), name: 'Example: Full body', rounds: 12, interval: 60,
        moves: [{name:'Kettlebell swings',reps:'15'},{name:'Push-ups',reps:'12'},{name:'Air squats',reps:'20'}] }
    ];
  };
  const save = list => { mem = list; try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e) {} };
  function uid(){ return Math.random().toString(36).slice(2,10); }
  let workouts = load();

  const fmt = s => { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s/60), r = s%60; return m ? m+':'+String(r).padStart(2,'0') : String(r); };
  const fmtInt = s => s % 60 === 0 ? (s/60 === 1 ? 'minute' : (s/60)+' min') : (s >= 60 ? fmt(s) : s+'s');
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function show(id){ document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === id)); window.scrollTo(0,0); }

  // ---------- library ----------
  function renderList(){
    const el = $('list');
    if (!workouts.length) { el.innerHTML = '<div class="empty">No workouts yet.<br>Make one below, or use Quick start.</div>'; return; }
    el.innerHTML = workouts.map(w => {
      const total = w.rounds * w.interval;
      const mvs = w.moves.filter(m => m.name.trim()).map(m => esc(m.name)).join(' · ') || 'No movements';
      return `<div class="item" data-id="${w.id}">
        <div style="min-width:0;flex:1" data-edit>
          <div class="t">${esc(w.name || 'Untitled')}</div>
          <div class="s">${w.rounds} × every ${fmtInt(w.interval)} · ${fmt(total)} total<br>${mvs}</div>
        </div>
        <div class="acts"><button class="play" data-play aria-label="Start">${PLAY}</button></div>
      </div>`;
    }).join('');
  }
  $('list').addEventListener('click', e => {
    const item = e.target.closest('.item'); if (!item) return;
    const w = workouts.find(x => x.id === item.dataset.id);
    if (e.target.closest('[data-play]')) startTimer(w);
    else if (e.target.closest('[data-edit]')) openEditor(w);
  });
  $('newBtn').onclick = () => openEditor(null);
  $('quickBtn').onclick = () => openEditor(null, true);

  // ---------- editor ----------
  let draft = null, editingId = null, quick = false;
  function openEditor(w, isQuick=false){
    quick = isQuick;
    editingId = w ? w.id : null;
    draft = w ? JSON.parse(JSON.stringify(w)) : { name:'', rounds:10, interval:60, moves:[{name:'',reps:''}] };
    $('wName').value = draft.name;
    $('editTitle').textContent = quick ? 'Quick start' : (w ? 'Edit workout' : 'New workout');
    $('deleteBtn').style.visibility = w ? 'visible' : 'hidden';
    $('saveBtn').textContent = quick ? 'Start' : 'Save';
    $('wName').parentElement.style.display = quick ? 'none' : '';
    renderSteppers(); renderMoves(); show('editor');
  }
  function renderSteppers(){
    document.querySelector('[data-k=rounds] span').textContent = draft.rounds;
    document.querySelector('[data-k=interval] span').textContent = fmt(draft.interval) + (draft.interval < 60 ? 's' : '');
  }
  document.querySelectorAll('.stepper').forEach(st => {
    st.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const d = +b.dataset.d, k = st.dataset.k;
      if (k === 'rounds') draft.rounds = Math.min(99, Math.max(1, draft.rounds + d));
      else {
        const step = draft.interval + d*15 > 60 || (d < 0 && draft.interval > 60) ? 30 : 15;
        draft.interval = Math.min(600, Math.max(15, draft.interval + d*step));
      }
      renderSteppers();
    });
  });
  function renderMoves(){
    $('mvList').innerHTML = draft.moves.map((m,i) => `
      <div class="mv">
        <span class="n">${i+1}</span>
        <input data-i="${i}" data-f="name" placeholder="Movement" value="${esc(m.name)}" maxlength="40">
        <input class="rp" data-i="${i}" data-f="reps" placeholder="Reps" value="${esc(m.reps)}" maxlength="14">
        <button class="x" data-del="${i}" aria-label="Remove">×</button>
      </div>`).join('');
  }
  $('mvList').addEventListener('input', e => { const t = e.target; if (t.dataset.f) draft.moves[+t.dataset.i][t.dataset.f] = t.value; });
  $('mvList').addEventListener('click', e => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    draft.moves.splice(+b.dataset.del, 1);
    if (!draft.moves.length) draft.moves.push({name:'',reps:''});
    renderMoves();
  });
  $('addMv').onclick = () => {
    draft.moves.push({name:'',reps:''}); renderMoves();
    const ins = $('mvList').querySelectorAll('input[data-f=name]'); ins[ins.length-1].focus();
  };
  $('cancelEdit').onclick = () => { renderList(); show('library'); };
  $('saveBtn').onclick = () => {
    draft.name = $('wName').value.trim();
    draft.moves = draft.moves.map(m => ({name:m.name.trim(), reps:m.reps.trim()})).filter(m => m.name || m.reps);
    if (quick) { startTimer({...draft, name: 'Quick EMOM'}); return; }
    if (!draft.name) draft.name = 'Untitled';
    if (editingId) workouts = workouts.map(w => w.id === editingId ? {...draft, id: editingId} : w);
    else workouts.unshift({...draft, id: uid()});
    save(workouts); renderList(); show('library');
  };
  $('deleteBtn').onclick = () => confirmBox(`Delete “${esc(draft.name || 'Untitled')}”?`, 'Delete', () => {
    workouts = workouts.filter(w => w.id !== editingId); save(workouts); renderList(); show('library');
  });

  // ---------- confirm ----------
  function confirmBox(text, yes, fn){
    $('modalText').innerHTML = text; $('modalYes').textContent = yes; $('modal').classList.add('on');
    $('modalYes').onclick = () => { $('modal').classList.remove('on'); fn(); };
    $('modalNo').onclick = () => $('modal').classList.remove('on');
  }

  // ---------- audio ----------
  let ctx = null, soundOn = true;
  function initAudio(){
    try { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume(); } catch(e) {}
  }
  function beep(freq=880, dur=0.12, vol=0.25){
    if (!soundOn || !ctx) return;
    try {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+0.01); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
    } catch(e) {}
  }
  $('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? 'Sound on' : 'Sound off'; initAudio(); };

  // ---------- wake lock ----------
  let lock = null;
  async function wake(on){
    try {
      if (on && 'wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); }
      if (!on && lock) { await lock.release(); lock = null; }
    } catch(e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) wake(true); });

  // ---------- timer ----------
  let W = null, running = false, startAt = 0, elapsedBefore = 0, raf = 0, lastSec = null, lastIdx = null, finished = false;
  const total = () => PREP + W.rounds * W.interval;
  const elapsed = () => elapsedBefore + (running ? (performance.now() - startAt)/1000 : 0);
  const moveAt = i => (W.moves.length ? W.moves[i % W.moves.length] : null);

  function startTimer(w){
    W = w; elapsedBefore = 0; running = false; finished = false; lastSec = null; lastIdx = null;
    $('tName').textContent = w.name;
    $('center').classList.remove('done');
    show('timer'); paint(); play();
  }
  function play(){
    initAudio();
    if (finished) { elapsedBefore = 0; finished = false; lastSec = lastIdx = null; $('center').classList.remove('done'); }
    running = true; startAt = performance.now(); wake(true); loop();
  }
  function pause(){ elapsedBefore = elapsed(); running = false; cancelAnimationFrame(raf); wake(false); paint(); }
  function loop(){ paint(); if (running) raf = requestAnimationFrame(loop); }

  function paint(){
    const e = elapsed();
    $('ppBtn').innerHTML = running ? PAUSE : PLAY;
    if (e >= total()) return finish();

    let remain, idx, frac, prep = e < PREP;
    if (prep) { remain = PREP - e; idx = -1; frac = e / PREP; }
    else {
      const t = e - PREP; idx = Math.floor(t / W.interval);
      remain = W.interval - (t - idx * W.interval); frac = (t - idx*W.interval) / W.interval;
    }
    const sec = Math.ceil(remain);
    const clock = $('tClock');
    clock.textContent = fmt(remain);
    clock.classList.toggle('prep', prep);
    clock.classList.toggle('low', !prep && sec <= 3);
    $('tProg').style.width = (frac*100).toFixed(2) + '%';

    const cur = prep ? moveAt(0) : moveAt(idx);
    const nxt = prep ? null : (idx + 1 < W.rounds ? moveAt(idx + 1) : null);
    $('tRound').textContent = prep ? 'Get ready' : `Round ${idx+1} of ${W.rounds}`;
    $('tMove').textContent = cur ? (cur.name || '—') : (prep ? '' : 'Go');
    $('tReps').textContent = cur && cur.reps ? cur.reps + (/^\d+$/.test(cur.reps) ? ' reps' : '') : '';
    $('tNext').innerHTML = prep ? (cur ? 'First up' : '') : (nxt && W.moves.length > 1 ? `Next · <b>${esc(nxt.name)}</b>${nxt.reps ? ' · '+esc(nxt.reps) : ''}` : (idx+1 >= W.rounds ? 'Last round' : ''));

    // sounds
    if (running) {
      if (idx !== lastIdx && lastIdx !== null) { beep(1320, 0.45, 0.35); if (navigator.vibrate) navigator.vibrate(200); }
      else if (sec !== lastSec && sec <= 3 && sec >= 1 && lastSec !== null) beep(880, 0.12);
    }
    lastSec = sec; lastIdx = idx;
  }
  function finish(){
    running = false; finished = true; cancelAnimationFrame(raf); wake(false);
    if (lastIdx !== 'done') { beep(1320,.25,.35); setTimeout(()=>beep(1320,.25,.35),300); setTimeout(()=>beep(1760,.6,.35),600); }
    lastIdx = 'done';
    $('center').classList.add('done');
    $('tRound').textContent = `${W.rounds} rounds · ${fmt(W.rounds*W.interval)}`;
    $('tClock').textContent = 'Done'; $('tClock').className = 'clock';
    $('tProg').style.width = '100%';
    $('tMove').textContent = 'Nice work.'; $('tReps').textContent = ''; $('tNext').textContent = '';
    $('ppBtn').innerHTML = PLAY;
  }

  $('ppBtn').onclick = () => running ? pause() : play();
  $('resetBtn').onclick = () => {
    const was = running; running = false; cancelAnimationFrame(raf);
    elapsedBefore = 0; finished = false; lastSec = lastIdx = null; $('center').classList.remove('done');
    if (was) play(); else paint();
  };
  $('skipBtn').onclick = () => {
    if (finished) return;
    const e = elapsed();
    const target = e < PREP ? PREP : PREP + (Math.floor((e - PREP)/W.interval) + 1) * W.interval;
    elapsedBefore = target + 0.001; if (running) startAt = performance.now();
    paint();
  };
  $('exitBtn').onclick = () => {
    const leave = () => { running = false; cancelAnimationFrame(raf); wake(false); renderList(); show('library'); };
    if (running || (elapsed() > 0 && !finished)) { const was = running; if (was) pause(); confirmBox('End this workout?', 'End', leave); $('modalNo').onclick = () => { $('modal').classList.remove('on'); if (was) play(); }; }
    else leave();
  };

  renderList();
})();
</script>
</body>
</html>
